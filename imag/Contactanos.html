<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tinta y Papel — Contáctanos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Caveat:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="../css/Contactanos.css" rel="stylesheet">
</head>
<body>

<!-- ===== MENÚ (igual que en inicio.html) ===== -->
<nav class="ribbon-nav">
  <div class="nav-flex">
    <span class="ribbon-seal">Tinta &amp; Papel</span>
    <a href="../index.html">Inicio</a>
    <a href="../index.html#poemas">Poemas</a>
    <a href="Imagenes.html#galeria">Galería</a>
    <a href="Imagenes.html#video">Video</a>
    <a href="Contactanos.html">Escribe tu carta</a>
  </div>
</nav>

<main>

  <!-- ===== FORMULARIO (SOBRE DE CARTA) ===== -->
  <section id="contacto">
    <div class="container">
      <div class="text-center mb-5">
        <span class="section-tag">Tu turno</span>
        <h2 class="section-title">Escribe tu propia carta</h2>
        <p>Compártela con este cuaderno colectivo. Puede ser anónima.</p>
      </div>

      <form class="envelope-wrap" id="love-form">
        <div class="row g-4">
          <div class="col-md-6">
            <label class="form-label" for="nombre">Tu nombre (o seudónimo)</label>
            <input type="text" class="form-control" id="nombre" placeholder="Ej. Luna" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="destinatario">¿Para quién es?</label>
            <input type="text" class="form-control" id="destinatario" placeholder="Ej. Para ti, que lo sabes" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="tipo">Tipo de texto</label>
            <select class="form-select" id="tipo">
              <option>Poema</option>
              <option>Carta</option>
              <option>Nota corta</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="edad">Tu edad</label>
            <input type="number" class="form-control" id="edad" min="13" max="99" placeholder="Ej. 16">
          </div>
          <div class="col-12">
            <label class="form-label" for="mensaje">Tu texto</label>
            <textarea class="form-control" id="mensaje" rows="5" placeholder="Escribe aquí lo que quieras decir..." required></textarea>
          </div>
          <div class="col-12 text-center pt-2">
            <button type="submit" class="btn btn-wine px-5">Enviar carta</button>
            <p id="form-msg" class="mt-3 mb-0 script fs-4" style="color:var(--sage); display:none;">
              Gracias, tu carta fue guardada en el cuaderno ✧
            </p>
          </div>
        </div>
      </form>
    </div>
  </section>

</main>

<footer>
  <div class="script">Tinta &amp; Papel</div>
  <p>hecho con cariño para quienes todavía escriben cartas · © 2026</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('love-form').addEventListener('submit', function(e){
    e.preventDefault();
    document.getElementById('form-msg').style.display = 'block';
    this.reset();
  });
</script>
</body>
</html>
